<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background:#080e1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#14233c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#080e1a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="greenSentinelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redAlertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Card and Box Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e33"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="650" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="650"/>
    <line x1="450" y1="0" x2="450" y2="650"/>
    <line x1="750" y1="0" x2="750" y2="650"/>
    <line x1="1000" y1="0" x2="1000" y2="650"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 38)">
    <rect x="0" y="0" width="240" height="24" rx="12" fill="#1e293b" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#34d399"/>
    <text x="24" y="16" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.2">FAIL-SAFE RUNTIME GOVERNANCE</text>

    <text x="0" y="56" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">Real-Time AI Safety Net &amp; Zero-Overhead Fallback</text>
    <text x="0" y="80" fill="#94a3b8" font-size="14" font-weight="400">Autonomous collision avoidance: instant 0.7 microsecond switch to classical physics ensures zero crashes and 100% thermodynamic integrity.</text>
  </g>

  <!-- TOP PANEL: DUAL-HAMILTONIAN CONTROL PIPELINE (X: 60 - 1140, Y: 130 - 325) -->
  <g transform="translate(60, 130)">
    <rect width="1080" height="185" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- PIPELINE STEP 1: MACE Fast Path (Left) -->
    <g transform="translate(30, 24)">
      <rect width="260" height="136" rx="12" fill="#0c2326" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="8" fill="#047857"/>
      <path d="M 17 24 L 19 26 L 23 22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      
      <text x="36" y="28" fill="#34d399" font-size="12" font-weight="800" letter-spacing="0.5">PRIMARY PATH: MACE GNN</text>
      <text x="20" y="56" fill="#ffffff" font-size="15" font-weight="700">Quantum Force Evaluation</text>
      <text x="20" y="76" fill="#a7f3d0" font-size="11.5">E(3)-Equivariant Message Passing</text>

      <g transform="translate(20, 94)">
        <rect width="130" height="22" rx="5" fill="rgba(16,185,129,0.2)"/>
        <text x="65" y="15" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">σ_F &lt; 0.05 eV/Å (Safe)</text>
      </g>
    </g>

    <!-- PIPELINE STEP 2: Real-time UQ Sentinel (Center-Left) -->
    <!-- Connecting Arrow 1 -->
    <path d="M 290 92 L 340 92" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <circle cx="315" cy="92" r="3" fill="#34d399"/>

    <g transform="translate(345, 24)">
      <rect width="280" height="136" rx="12" fill="#152136" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="8" fill="#0284c7"/>
      <circle cx="20" cy="24" r="4" fill="#38bdf8" filter="url(#glowGreen)"/>
      
      <text x="36" y="28" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="0.5">REAL-TIME UQ SENTINEL</text>
      <text x="20" y="56" fill="#ffffff" font-size="15" font-weight="700">Dual Uncertainty Engine</text>
      <text x="20" y="74" fill="#cbd5e1" font-size="11.5">1. Committee Variance (Ensemble)</text>
      <text x="20" y="90" fill="#cbd5e1" font-size="11.5">2. Distance Clash &amp; Dihedral Guard</text>

      <g transform="translate(20, 102)">
        <rect width="190" height="20" rx="4" fill="rgba(56,189,248,0.15)"/>
        <text x="95" y="14" fill="#bae6fd" font-size="10" font-weight="600" text-anchor="middle">Monitored Every 2 fs Step</text>
      </g>
    </g>

    <!-- PIPELINE STEP 3: 0.7 μs Toggle Relay (Center-Right) -->
    <!-- Split Branches -->
    <path d="M 625 72 L 675 52" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 625 112 L 675 132" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3"/>

    <g transform="translate(680, 24)">
      <rect width="365" height="136" rx="12" fill="#181d2f" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

      <!-- Normal Branch Indicator -->
      <g transform="translate(18, 16)">
        <rect width="330" height="46" rx="8" fill="#0a2a22" stroke="#10b981" stroke-width="1"/>
        <circle cx="14" cy="23" r="5" fill="#34d399"/>
        <text x="28" y="20" fill="#ffffff" font-size="12" font-weight="700">Continue AI Trajectory</text>
        <text x="28" y="36" fill="#a7f3d0" font-size="10.5">High confidence → Standard quantum MD integration</text>
        <text x="270" y="27" fill="#34d399" font-size="11" font-weight="800">96.8%</text>
      </g>

      <!-- Fallback Switch Indicator -->
      <g transform="translate(18, 74)">
        <rect width="330" height="48" rx="8" fill="#2d121c" stroke="#f43f5e" stroke-width="1.5"/>
        <circle cx="14" cy="24" r="5" fill="#f43f5e"/>
        <text x="28" y="20" fill="#ffffff" font-size="12" font-weight="800">0.7 μs Fallback Switch to SOMD2</text>
        <text x="28" y="37" fill="#fecdd3" font-size="10.5">σ_F ≥ 0.05 → Toggle to Classical Amber ff14SB</text>
        <text x="270" y="28" fill="#f43f5e" font-size="11" font-weight="800">3.2%</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM PANEL: DYNAMIC SIMULATION TRACE GRAPH (X: 60 - 1140, Y: 330 - 550) -->
  <g transform="translate(60, 335)">
    <rect width="1080" height="215" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Graph Header -->
    <g transform="translate(30, 24)">
      <text x="0" y="0" fill="#ffffff" font-size="15" font-weight="700">Real-Time Force Uncertainty Trace [σ_F]</text>
      <text x="0" y="18" fill="#94a3b8" font-size="12">Live monitoring over 100 picoseconds of free energy perturbation trajectory</text>
    </g>

    <!-- Graph Status Badges Top Right -->
    <g transform="translate(810, 18)">
      <rect width="240" height="28" rx="6" fill="#0f281e" stroke="#10b981" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#34d399"/>
      <text x="26" y="18" fill="#34d399" font-size="11" font-weight="700">ZERO CRASHES • 100% SUCCESS</text>
    </g>

    <!-- GRAPH CANVAS REGION -->
    <!-- X: 70 to 1020, Y: 60 to 180 (Height 120) -->
    <g transform="translate(50, 48)">
      
      <!-- Axis Lines -->
      <line x1="40" y1="140" x2="980" y2="140" stroke="#334155" stroke-width="1.5"/>
      <line x1="40" y1="20" x2="40" y2="140" stroke="#334155" stroke-width="1.5"/>

      <!-- Y-Axis Ticks & Labels -->
      <text x="30" y="143" fill="#64748b" font-size="10" text-anchor="end">0.00</text>
      <text x="30" y="82" fill="#64748b" font-size="10" text-anchor="end">0.05</text>
      <text x="30" y="24" fill="#64748b" font-size="10" text-anchor="end">0.10</text>
      <text x="25" y="0" fill="#94a3b8" font-size="10" font-weight="600">eV/Å</text>

      <!-- Grid Line for 0.05 Threshold -->
      <line x1="40" y1="80" x2="980" y2="80" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
      <rect x="850" y="66" width="130" height="18" rx="4" fill="rgba(245,158,11,0.2)"/>
      <text x="915" y="79" fill="#fcd34d" font-size="9" font-weight="700" text-anchor="middle">Threshold: 0.05 eV/Å</text>

      <!-- Shaded Safe Region (< 0.05) -->
      <rect x="40" y="80" width="940" height="60" fill="#10b981" fill-opacity="0.04"/>

      <!-- Shaded Red Alert Region during Fallback Event (X: 420 to 570) -->
      <rect x="430" y="20" width="160" height="120" fill="url(#redAlertGlow)"/>
      <rect x="430" y="20" width="160" height="120" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

      <!-- Event Callout Flag Above Spike -->
      <g transform="translate(440, 6)">
        <rect width="140" height="24" rx="5" fill="#881337" stroke="#f43f5e" stroke-width="1.5" filter="url(#glowRed)"/>
        <text x="70" y="16" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">SOMD2 FALLBACK (16 steps)</text>
      </g>

      <!-- The Dynamic Trace Curve -->
      <!-- Smooth green baseline, sharp red spike, recovery to green -->
      <!-- Area fill under curve -->
      <path d="M 40 108 
               L 90 102 L 140 114 L 190 105 L 240 100 L 290 110 L 340 103 L 390 98 
               L 430 92 
               L 460 48 L 490 32 L 520 42 L 560 74 
               L 590 96 
               L 640 104 L 690 101 L 740 112 L 790 105 L 840 99 L 890 108 L 940 102 L 980 105
               L 980 140 L 40 140 Z" fill="url(#traceGrad)"/>

      <!-- Normal Green Line Segments -->
      <path d="M 40 108 L 90 102 L 140 114 L 190 105 L 240 100 L 290 110 L 340 103 L 390 98 L 430 92" 
            fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Red Alarm Spike Line Segment (Exceeding 0.05 eV/Å) -->
      <path d="M 430 92 L 460 48 L 490 32 L 520 42 L 560 74 L 590 96" 
            fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" filter="url(#glowRed)"/>

      <!-- Recovered Green Line Segment -->
      <path d="M 590 96 L 640 104 L 690 101 L 740 112 L 790 105 L 840 99 L 890 108 L 940 102 L 980 105" 
            fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Anomaly Data Point Circle -->
      <circle cx="490" cy="32" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" filter="url(#glowRed)"/>

      <!-- X-Axis Labels -->
      <text x="40" y="156" fill="#64748b" font-size="10" text-anchor="middle">0 ps</text>
      <text x="240" y="156" fill="#64748b" font-size="10" text-anchor="middle">20 ps</text>
      <text x="440" y="156" fill="#64748b" font-size="10" text-anchor="middle">40 ps</text>
      <text x="510" y="156" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">OOD Spike (50 ps)</text>
      <text x="740" y="156" fill="#64748b" font-size="10" text-anchor="middle">70 ps</text>
      <text x="980" y="156" fill="#64748b" font-size="10" text-anchor="middle">100 ps</text>
    </g>
  </g>

  <!-- BOTTOM KPI STRIP -->
  <g transform="translate(60, 565)">
    <rect width="1080" height="55" rx="10" fill="#0f192b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Metric 1 -->
    <g transform="translate(30, 12)">
      <text x="0" y="12" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="0.5">SWITCH LATENCY</text>
      <text x="0" y="31" fill="#38bdf8" font-size="17" font-weight="800">0.7 μs</text>
      <text x="58" y="31" fill="#94a3b8" font-size="11">zero GPU pipeline stall</text>
    </g>

    <line x1="260" y1="10" x2="260" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metric 2 -->
    <g transform="translate(290, 12)">
      <text x="0" y="12" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="0.5">SIMULATION COMPLETION</text>
      <text x="0" y="31" fill="#34d399" font-size="17" font-weight="800">100.0%</text>
      <text x="64" y="31" fill="#a7f3d0" font-size="11">zero NaN / unphysical crashes</text>
    </g>

    <line x1="560" y1="10" x2="560" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metric 3 -->
    <g transform="translate(590, 12)">
      <text x="0" y="12" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="0.5">FALLBACK FREQUENCY</text>
      <text x="0" y="31" fill="#ffffff" font-size="17" font-weight="800">&lt; 3.5%</text>
      <text x="65" y="31" fill="#94a3b8" font-size="11">rare edge cases only</text>
    </g>

    <line x1="820" y1="10" x2="820" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metric 4 -->
    <g transform="translate(850, 12)">
      <text x="0" y="12" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="0.5">ENERGY CONSERVATION</text>
      <text x="0" y="31" fill="#34d399" font-size="17" font-weight="800">Strictly Preserved</text>
      <text x="135" y="31" fill="#94a3b8" font-size="11">dual-Hamiltonian</text>
    </g>
  </g>
</svg>
