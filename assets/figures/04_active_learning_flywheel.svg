<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background:#070d18; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="45%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#12233f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>

    <!-- Flywheel Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="flowArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="flowArrowEmerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <!-- Glowing Filters -->
    <filter id="hubShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="650" fill="url(#bgGlow)"/>

  <!-- Subtle Circular Radar Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1" fill="none">
    <circle cx="410" cy="355" r="100"/>
    <circle cx="410" cy="355" r="190"/>
    <circle cx="410" cy="355" r="275"/>
    <line x1="410" y1="80" x2="410" y2="630"/>
    <line x1="135" y1="355" x2="685" y2="355"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#132438" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
    <text x="24" y="16" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.2">COMPOUNDING DATA MOAT</text>

    <text x="0" y="56" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">The Self-Improving Active Learning Flywheel</text>
    <text x="0" y="80" fill="#94a3b8" font-size="14" font-weight="400">Every drug campaign autonomously harvests edge cases, compounds quantum training data, and drives fallback rates to near-zero.</text>
  </g>

  <!-- LEFT REGION: THE ACTIVE LEARNING FLYWHEEL (Center at X: 400, Y: 360) -->
  <g id="flywheelGroup">
    
    <!-- Outer Orbit Guide Path with Flow Direction Chevrons -->
    <circle cx="400" cy="360" r="175" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-dasharray="8,6" opacity="0.4"/>
    
    <!-- Center Hub: Proprietary Competitive Moat -->
    <circle cx="400" cy="360" r="85" fill="url(#hubGlow)"/>
    <circle cx="400" cy="360" r="72" fill="#0c1a2e" stroke="#10b981" stroke-width="2" filter="url(#hubShadow)"/>
    <circle cx="400" cy="360" r="64" fill="#081324" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Center Emblem Text -->
    <g transform="translate(400, 342)" text-anchor="middle">
      <circle cx="0" cy="-14" r="9" fill="rgba(16,185,129,0.2)"/>
      <path d="M -4 -14 L -1 -11 L 5 -17" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      
      <text x="0" y="5" fill="#34d399" font-size="10" font-weight="800" letter-spacing="1.2">PROPRIETARY MOAT</text>
      <text x="0" y="20" fill="#ffffff" font-size="12" font-weight="800">Every Campaign</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10" font-weight="600">Expands AI Lead</text>
    </g>

    <!-- 6 ORBITING STAGE NODES (Radius 175) -->

    <!-- STEP 1: Top (Angle 270° -> x: 400, y: 185) -->
    <g transform="translate(400, 180)">
      <!-- Connecting orbit arrow to next node -->
      <path d="M 45 5 A 175 175 0 0 1 145 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>
      
      <rect x="-95" y="-35" width="190" height="64" rx="10" fill="url(#cardDark)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-75" cy="-15" r="10" fill="#0284c7"/>
      <text x="-75" y="-11" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text>
      <text x="-58" y="-11" fill="#38bdf8" font-size="11.5" font-weight="700">Screening Run</text>
      <text x="-75" y="6" fill="#cbd5e1" font-size="10" font-weight="500">Unmapped chemical space</text>
      <text x="-75" y="19" fill="#64748b" font-size="9.5">Target binding exploration</text>
    </g>

    <!-- STEP 2: Top Right (Angle 330° -> x: 552, y: 272) -->
    <g transform="translate(560, 275)">
      <!-- Connecting orbit arrow to next node -->
      <path d="M 10 38 A 175 175 0 0 1 -15 145" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)"/>
      
      <rect x="-90" y="-35" width="185" height="64" rx="10" fill="url(#cardDark)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-70" cy="-15" r="10" fill="#d97706"/>
      <text x="-70" y="-11" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text>
      <text x="-54" y="-11" fill="#fbbf24" font-size="11.5" font-weight="700">UQ Edge Harvest</text>
      <text x="-70" y="6" fill="#cbd5e1" font-size="10" font-weight="500">Flags σ_F &gt; 0.05 poses</text>
      <text x="-70" y="19" fill="#fcd34d" font-size="9.5">Auto OOD Replay Buffer</text>
    </g>

    <!-- STEP 3: Bottom Right (Angle 30° -> x: 552, y: 447) -->
    <g transform="translate(555, 455)">
      <!-- Connecting orbit arrow to next node -->
      <path d="M -40 25 A 175 175 0 0 1 -140 70" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#flowArrow)"/>
      
      <rect x="-90" y="-35" width="185" height="64" rx="10" fill="url(#cardDark)" stroke="#a855f7" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-70" cy="-15" r="10" fill="#7c3aed"/>
      <text x="-70" y="-11" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text>
      <text x="-54" y="-11" fill="#c084fc" font-size="11.5" font-weight="700">RMSD Clustering</text>
      <text x="-70" y="6" fill="#cbd5e1" font-size="10" font-weight="500">Deduplicates 1M+ poses</text>
      <text x="-70" y="19" fill="#e9d5ff" font-size="9.5">Selects ~500 unique states</text>
    </g>

    <!-- STEP 4: Bottom (Angle 90° -> x: 400, y: 535) -->
    <g transform="translate(400, 535)">
      <!-- Connecting orbit arrow to next node -->
      <path d="M -50 -5 A 175 175 0 0 1 -148 -70" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#flowArrowEmerald)"/>
      
      <rect x="-95" y="-35" width="190" height="64" rx="10" fill="url(#cardDark)" stroke="#06b6d4" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-75" cy="-15" r="10" fill="#0891b2"/>
      <text x="-75" y="-11" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">4</text>
      <text x="-58" y="-11" fill="#22d3ee" font-size="11.5" font-weight="700">DFT Labeling</text>
      <text x="-75" y="6" fill="#cbd5e1" font-size="10" font-weight="500">ωB97M-D3 single-points</text>
      <text x="-75" y="19" fill="#67e8f9" font-size="9.5">Ultra-precise quantum forces</text>
    </g>

    <!-- STEP 5: Bottom Left (Angle 150° -> x: 248, y: 447) -->
    <g transform="translate(245, 455)">
      <!-- Connecting orbit arrow to next node -->
      <path d="M -15 -35 A 175 175 0 0 1 12 -145" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#flowArrowEmerald)"/>
      
      <rect x="-95" y="-35" width="190" height="64" rx="10" fill="url(#cardDark)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-75" cy="-15" r="10" fill="#059669"/>
      <text x="-75" y="-11" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text>
      <text x="-58" y="-11" fill="#34d399" font-size="11.5" font-weight="700">Frozen PEFT Tuning</text>
      <text x="-75" y="6" fill="#cbd5e1" font-size="10" font-weight="500">Frozen foundation backbone</text>
      <text x="-75" y="19" fill="#a7f3d0" font-size="9.5">Zero catastrophic forgetting</text>
    </g>

    <!-- STEP 6: Top Left (Angle 210° -> x: 248, y: 272) -->
    <g transform="translate(240, 275)">
      <!-- Connecting orbit arrow to next node -->
      <path d="M 40 -25 A 175 175 0 0 1 140 -70" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#flowArrowEmerald)"/>
      
      <rect x="-95" y="-35" width="190" height="64" rx="10" fill="url(#cardDark)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="-75" cy="-15" r="10" fill="#059669"/>
      <text x="-75" y="-11" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">6</text>
      <text x="-58" y="-11" fill="#34d399" font-size="11.5" font-weight="700">Hot-Reload Deploy</text>
      <text x="-75" y="6" fill="#cbd5e1" font-size="10" font-weight="500">Live GPU weight update</text>
      <text x="-75" y="19" fill="#6ee7b7" font-size="9.5">Fallback rate plummets!</text>
    </g>

  </g>

  <!-- RIGHT REGION: FALLBACK TRAJECTORY & STRATEGIC PILLARS (X: 740 - 1140) -->
  <g transform="translate(740, 130)">
    
    <!-- CARD 1: Fallback Rate Trajectory Chart -->
    <g transform="translate(0, 0)">
      <rect width="400" height="235" rx="14" fill="url(#cardDark)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Card Title -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#ffffff" font-size="15" font-weight="800">Exponential Fallback Decay</text>
        <text x="0" y="18" fill="#94a3b8" font-size="11.5">Model learns target chemistry in real time</text>
      </g>

      <!-- Chart Canvas (Height 120) -->
      <g transform="translate(25, 65)">
        <!-- Horizontal Grid Lines -->
        <line x1="45" y1="120" x2="350" y2="120" stroke="#1e293b" stroke-width="1"/>
        <line x1="45" y1="70" x2="350" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="45" y1="20" x2="350" y2="20" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>

        <text x="35" y="123" fill="#64748b" font-size="9" text-anchor="end">0%</text>
        <text x="35" y="73" fill="#64748b" font-size="9" text-anchor="end">10%</text>
        <text x="35" y="23" fill="#64748b" font-size="9" text-anchor="end">20%</text>

        <!-- BAR 1: Campaign 0 (Initial) -->
        <rect x="65" y="29" width="48" height="91" rx="4" fill="#f43f5e" fill-opacity="0.8"/>
        <text x="89" y="22" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">18.2%</text>
        <text x="89" y="135" fill="#94a3b8" font-size="9.5" text-anchor="middle">Start</text>

        <!-- BAR 2: Campaign 1 -->
        <rect x="140" y="100" width="48" height="20" rx="4" fill="#f59e0b" fill-opacity="0.8"/>
        <text x="164" y="94" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">4.1%</text>
        <text x="164" y="135" fill="#94a3b8" font-size="9.5" text-anchor="middle">Iter 1</text>

        <!-- BAR 3: Campaign 3 -->
        <rect x="215" y="118" width="48" height="2" rx="1" fill="#34d399" fill-opacity="0.8"/>
        <text x="239" y="112" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">0.4%</text>
        <text x="239" y="135" fill="#94a3b8" font-size="9.5" text-anchor="middle">Iter 3</text>

        <!-- BAR 4: Campaign 5+ -->
        <rect x="290" y="119" width="48" height="1" rx="0.5" fill="#10b981"/>
        <text x="314" y="112" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">&lt; 0.05%</text>
        <text x="314" y="135" fill="#34d399" font-size="9.5" font-weight="700" text-anchor="middle">Mastery</text>
      </g>

      <text x="20" y="220" fill="#a7f3d0" font-size="11" font-weight="600">✓ 99.7% reduction in classical fallback calls</text>
    </g>

    <!-- CARD 2: Strategic Moat Highlights -->
    <g transform="translate(0, 252)">
      <rect width="400" height="150" rx="14" fill="url(#cardDark)" stroke="rgba(16,185,129,0.3)" stroke-width="1" filter="url(#cardShadow)"/>

      <text x="20" y="26" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1">SUSTAINABLE COMPETITIVE ADVANTAGE</text>

      <g transform="translate(20, 42)" font-size="11.5">
        <!-- Bullet 1 -->
        <g transform="translate(0, 0)">
          <circle cx="5" cy="5" r="4" fill="#38bdf8"/>
          <text x="16" y="9" fill="#ffffff" font-weight="700">Zero Synthetic Cost:</text>
          <text x="140" y="9" fill="#94a3b8">Active learning data generated in silico</text>
        </g>
        <!-- Bullet 2 -->
        <g transform="translate(0, 28)">
          <circle cx="5" cy="5" r="4" fill="#a855f7"/>
          <text x="16" y="9" fill="#ffffff" font-weight="700">100x Compute ROI:</text>
          <text x="135" y="9" fill="#94a3b8">Only ~500 single-points vs 1M steps</text>
        </g>
        <!-- Bullet 3 -->
        <g transform="translate(0, 56)">
          <circle cx="5" cy="5" r="4" fill="#10b981"/>
          <text x="16" y="9" fill="#ffffff" font-weight="700">Generalizable Asset:</text>
          <text x="145" y="9" fill="#94a3b8">Knowledge transfers to sister targets</text>
        </g>
      </g>

      <rect x="20" y="112" width="360" height="24" rx="6" fill="rgba(16,185,129,0.12)"/>
      <text x="200" y="128" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">Every screening iteration increases enterprise valuation</text>
    </g>

  </g>

  <!-- BOTTOM KPI STRIP -->
  <g transform="translate(60, 570)">
    <rect width="1080" height="50" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <g transform="translate(30, 16)">
      <text x="0" y="13" fill="#64748b" font-size="10" font-weight="600">DISCOVERY CYCLE</text>
      <text x="120" y="13" fill="#ffffff" font-size="12" font-weight="700">Autonomous OOD Ingestion</text>
    </g>

    <line x1="340" y1="10" x2="340" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(370, 16)">
      <text x="0" y="13" fill="#64748b" font-size="10" font-weight="600">QUANTUM EFFICIENCY</text>
      <text x="140" y="13" fill="#38bdf8" font-size="12" font-weight="700">&lt; 500 DFT labels / campaign</text>
    </g>

    <line x1="680" y1="10" x2="680" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <g transform="translate(710, 16)">
      <text x="0" y="13" fill="#64748b" font-size="10" font-weight="600">TRANSFERABILITY</text>
      <text x="120" y="13" fill="#34d399" font-size="12" font-weight="700">Cross-Target Scaffold Generalization</text>
    </g>
  </g>
</svg>
