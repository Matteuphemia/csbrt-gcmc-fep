<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background:#080d18; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background and Area Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#15213b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="oceanGlow" cx="420" cy="350" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0e2338" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080d18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensGlow" cx="420" cy="340" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quantumHalo" cx="420" cy="340" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e33"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="quantumCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122f2e"/>
      <stop offset="100%" stop-color="#0d1f21"/>
    </linearGradient>

    <!-- Lens Ring Gradients -->
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowLens" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="650" fill="url(#bgGlow)"/>

  <!-- Subtle Coordinate Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="650"/>
    <line x1="420" y1="0" x2="420" y2="650"/>
    <line x1="740" y1="0" x2="740" y2="650"/>
    <line x1="960" y1="0" x2="960" y2="650"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#132438" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
    <text x="24" y="16" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.2">SYSTEM ARCHITECTURE</text>

    <text x="0" y="56" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">The Quantum Microscope inside the Classical Ocean</text>
    <text x="0" y="80" fill="#94a3b8" font-size="14" font-weight="400">Deploying quantum E(3)-equivariant ML only where chemical reactions happen — letting classical mechanics handle the bulk solvent.</text>
  </g>

  <!-- LEFT CANVAS: THE OCEAN & MICROSCOPE (X: 60 - 710, Y: 130 - 550) -->
  <g transform="translate(40, 120)">
    <!-- Ocean Outer Circle (Solvated Protein System) -->
    <circle cx="360" cy="230" r="215" fill="url(#oceanGlow)" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Decorative Protein Ribbons (Secondary Structure in Ocean) -->
    <path d="M 200 130 Q 230 90 270 120 T 320 150 Q 360 180 390 140" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 190 310 Q 230 350 270 320 T 340 340 Q 370 360 390 310" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M 450 110 Q 480 80 520 120 T 560 160" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Ambient Water Molecules (H2O Chevrons) -->
    <g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
      <!-- Water 1 -->
      <g transform="translate(190, 200)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
      <!-- Water 2 -->
      <g transform="translate(230, 260) rotate(45)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
      <!-- Water 3 -->
      <g transform="translate(480, 170) rotate(-30)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
      <!-- Water 4 -->
      <g transform="translate(500, 280) rotate(120)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
      <!-- Water 5 -->
      <g transform="translate(280, 100) rotate(80)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
      <!-- Water 6 -->
      <g transform="translate(410, 390) rotate(-70)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
      <!-- Water 7 -->
      <g transform="translate(260, 390) rotate(15)">
        <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
        <line x1="0" y1="0" x2="-6" y2="7"/>
        <line x1="0" y1="0" x2="6" y2="7"/>
      </g>
    </g>

    <!-- Ocean Label Top Left -->
    <g transform="translate(170, 48)">
      <rect width="180" height="26" rx="6" fill="#0f1f38" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#38bdf8"/>
      <text x="24" y="17" fill="#93c5fd" font-size="11" font-weight="600">Bulk Solvent (49,960 atoms)</text>
      <text x="24" y="38" fill="#64748b" font-size="10">Amber ff14SB + TIP3P Water</text>
    </g>

    <!-- EMBEDDING BOUNDARY ZONE (Middle Ring) -->
    <circle cx="360" cy="230" r="145" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Boundary Annotation -->
    <path d="M 465 130 L 515 100 L 540 100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <circle cx="465" cy="130" r="3" fill="#38bdf8"/>
    <text x="548" y="97" fill="#38bdf8" font-size="10.5" font-weight="700">Embedding Interface</text>
    <text x="548" y="111" fill="#94a3b8" font-size="9.5">Mechanical + Electrostatic Coupling</text>

    <!-- THE QUANTUM MICROSCOPE LENS (Inner Focus) -->
    <!-- Glowing Outer Lens Rings -->
    <circle cx="360" cy="230" r="115" fill="url(#lensGlow)"/>
    <circle cx="360" cy="230" r="115" fill="none" stroke="url(#lensRing)" stroke-width="3" filter="url(#glowLens)"/>
    <circle cx="360" cy="230" r="115" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <circle cx="360" cy="230" r="105" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Reticle / Microscope Ticks -->
    <line x1="360" y1="110" x2="360" y2="122" stroke="#34d399" stroke-width="2"/>
    <line x1="360" y1="338" x2="360" y2="350" stroke="#34d399" stroke-width="2"/>
    <line x1="240" y1="230" x2="252" y2="230" stroke="#34d399" stroke-width="2"/>
    <line x1="468" y1="230" x2="480" y2="230" stroke="#34d399" stroke-width="2"/>

    <!-- Inside the Lens: The Active Ligand Molecule & Hydrating Waters -->
    <circle cx="360" cy="230" r="75" fill="url(#quantumHalo)"/>

    <g id="ligandMolecule" transform="translate(360, 230)">
      <!-- Chemical Graph Bonds (GNN Edges with Glowing Tensor Width) -->
      <!-- Aromatic Core Ring -->
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="rgba(16,185,129,0.15)" stroke="#34d399" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

      <!-- Functional Group Branches -->
      <!-- Right Amide Branch -->
      <line x1="24" y1="-14" x2="48" y2="-26" stroke="#34d399" stroke-width="2.5"/>
      <line x1="48" y1="-26" x2="68" y2="-16" stroke="#34d399" stroke-width="2"/>
      <line x1="48" y1="-26" x2="48" y2="-46" stroke="#f43f5e" stroke-width="2.5"/> <!-- C=O -->
      <line x1="45" y1="-26" x2="45" y2="-46" stroke="#f43f5e" stroke-width="1.5"/>

      <!-- Left Halogen / Heteroatom Branch -->
      <line x1="-24" y1="-14" x2="-48" y2="-22" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="-24" y1="14" x2="-45" y2="30" stroke="#fbbf24" stroke-width="2.5"/>

      <!-- GNN Message Passing Wave / Attention Arcs -->
      <path d="M -20 -35 Q 0 -48 20 -35" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8"/>
      <path d="M 28 0 Q 42 12 36 28" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8"/>

      <!-- Atoms / Graph Nodes -->
      <!-- Ring Carbons -->
      <circle cx="0" cy="-28" r="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="24" cy="-14" r="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="24" cy="14" r="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="0" cy="28" r="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="-24" cy="14" r="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="-24" cy="-14" r="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>

      <!-- Oxygen (C=O) -->
      <circle cx="48" cy="-46" r="6.5" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="48" y="-43" fill="#ffffff" font-size="7" font-weight="900" text-anchor="middle">O</text>

      <!-- Nitrogen (NH) -->
      <circle cx="68" cy="-16" r="6.5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="68" y="-13" fill="#ffffff" font-size="7" font-weight="900" text-anchor="middle">N</text>

      <!-- Fluorine -->
      <circle cx="-48" cy="-22" r="6.5" fill="#0891b2" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="-48" y="-19" fill="#ffffff" font-size="7" font-weight="900" text-anchor="middle">F</text>

      <!-- Sulfur -->
      <circle cx="-45" cy="30" r="7" fill="#854d0e" stroke="#facc15" stroke-width="1.5"/>
      <text x="-45" y="33" fill="#ffffff" font-size="7" font-weight="900" text-anchor="middle">S</text>

      <!-- Critical Hydrating Waters (GCMC Trapped Waters inside Pocket) -->
      <!-- Water W1 -->
      <g transform="translate(10, -58)">
        <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="3" fill="#ffffff" font-size="6.5" font-weight="800" text-anchor="middle">W</text>
        <line x1="8" y1="3" x2="38" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/> <!-- H-bond to O -->
      </g>
      <!-- Water W2 -->
      <g transform="translate(-15, 52)">
        <circle cx="0" cy="0" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="3" fill="#ffffff" font-size="6.5" font-weight="800" text-anchor="middle">W</text>
        <line x1="0" y1="-6" x2="-8" y2="-20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/> <!-- H-bond to Ring -->
      </g>
    </g>

    <!-- Lens Callout Tag Bottom -->
    <g transform="translate(260, 360)">
      <rect width="200" height="32" rx="16" fill="rgba(6,78,59,0.9)" stroke="#10b981" stroke-width="1.5" filter="url(#softGlow)"/>
      <circle cx="16" cy="16" r="6" fill="#34d399"/>
      <text x="30" y="20" fill="#ffffff" font-size="11.5" font-weight="800">MACE-GNN Core (~40 atoms)</text>
    </g>
  </g>

  <!-- RIGHT CANVAS: ARCHITECTURAL DECOMPOSITION CARDS (X: 740 - 1140) -->
  <g transform="translate(740, 130)">
    
    <!-- CARD 1: Classical Bulk Solvent -->
    <g transform="translate(0, 0)">
      <rect width="400" height="116" rx="12" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.3)" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="116" rx="2" fill="#38bdf8"/>
      
      <text x="20" y="24" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1">ZONE 1: BULK ENVIRONMENT</text>
      <text x="20" y="46" fill="#ffffff" font-size="16" font-weight="700">Classical Molecular Mechanics</text>
      <text x="20" y="66" fill="#94a3b8" font-size="12">Amber ff14SB + TIP3P Solvation Ocean</text>
      
      <g transform="translate(20, 80)">
        <rect width="115" height="22" rx="6" fill="rgba(56,189,248,0.1)"/>
        <text x="57" y="15" fill="#7dd3fc" font-size="10.5" font-weight="600" text-anchor="middle">49,960 Atoms (99.9%)</text>
        
        <rect x="125" y="0" width="130" height="22" rx="6" fill="rgba(255,255,255,0.05)"/>
        <text x="190" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" text-anchor="middle">High-Throughput GPU MD</text>
      </g>
    </g>

    <!-- CARD 2: Dual-Zone Embedding -->
    <g transform="translate(0, 132)">
      <rect width="400" height="116" rx="12" fill="url(#cardGrad)" stroke="rgba(14,165,233,0.3)" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="116" rx="2" fill="#0ea5e9"/>
      
      <text x="20" y="24" fill="#0ea5e9" font-size="10.5" font-weight="700" letter-spacing="1">ZONE 2: SEAMLESS BOUNDARY</text>
      <text x="20" y="46" fill="#ffffff" font-size="16" font-weight="700">Electrostatic &amp; LJ Embedding</text>
      <text x="20" y="66" fill="#94a3b8" font-size="12">Continuously polarizes quantum core with surrounding charges</text>
      
      <g transform="translate(20, 80)">
        <rect width="135" height="22" rx="6" fill="rgba(14,165,233,0.1)"/>
        <text x="67" y="15" fill="#38bdf8" font-size="10.5" font-weight="600" text-anchor="middle">Dual-Zone Coupling</text>
        
        <rect x="145" y="0" width="140" height="22" rx="6" fill="rgba(255,255,255,0.05)"/>
        <text x="215" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" text-anchor="middle">Zero Boundary Artifacts</text>
      </g>
    </g>

    <!-- CARD 3: Quantum MACE GNN Lens -->
    <g transform="translate(0, 264)">
      <rect width="400" height="136" rx="12" fill="url(#quantumCardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="5" height="136" rx="2" fill="#34d399"/>
      
      <text x="20" y="24" fill="#34d399" font-size="10.5" font-weight="800" letter-spacing="1">ZONE 3: THE QUANTUM CORE</text>
      <text x="20" y="46" fill="#ffffff" font-size="16" font-weight="800">E(3)-Equivariant MACE GNN</text>
      <text x="20" y="66" fill="#a7f3d0" font-size="12">Captures dynamic charge transfer, torsions &amp; trapped water</text>
      
      <g transform="translate(20, 80)">
        <rect width="115" height="22" rx="6" fill="rgba(16,185,129,0.2)"/>
        <text x="57" y="15" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">~40 Atoms (0.1%)</text>
        
        <rect x="125" y="0" width="145" height="22" rx="6" fill="rgba(16,185,129,0.15)"/>
        <text x="197" y="15" fill="#34d399" font-size="10.5" font-weight="700" text-anchor="middle">DFT-Level Fidelity (ωB97M)</text>
      </g>

      <text x="20" y="122" fill="#6ee7b7" font-size="11" font-weight="600">✓ Invariant to rotations • Full polarization response</text>
    </g>

  </g>

  <!-- BOTTOM KPI STRIP (4 METRICS) -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="60" rx="12" fill="#0f192b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- KPI 1 -->
    <g transform="translate(30, 14)">
      <text x="0" y="14" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">TOTAL SYSTEM ATOMS</text>
      <text x="0" y="34" fill="#ffffff" font-size="18" font-weight="800">50,000</text>
      <text x="68" y="34" fill="#38bdf8" font-size="11" font-weight="500">solvated complex</text>
    </g>

    <line x1="260" y1="12" x2="260" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- KPI 2 -->
    <g transform="translate(290, 14)">
      <text x="0" y="14" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">QUANTUM AI COMPUTE</text>
      <text x="0" y="34" fill="#34d399" font-size="18" font-weight="800">0.1%</text>
      <text x="48" y="34" fill="#94a3b8" font-size="11" font-weight="500">binding pocket only</text>
    </g>

    <line x1="530" y1="12" x2="530" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- KPI 3 -->
    <g transform="translate(560, 14)">
      <text x="0" y="14" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">GPU MM THROUGHPUT</text>
      <text x="0" y="34" fill="#ffffff" font-size="18" font-weight="800">99.9%</text>
      <text x="56" y="34" fill="#94a3b8" font-size="11" font-weight="500">classical bulk speed</text>
    </g>

    <line x1="800" y1="12" x2="800" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- KPI 4 -->
    <g transform="translate(830, 14)">
      <text x="0" y="14" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">BINDING PRECISION</text>
      <text x="0" y="34" fill="#34d399" font-size="18" font-weight="800">&lt; 0.3 <tspan font-size="12" font-weight="500">kcal/mol</tspan></text>
      <text x="110" y="34" fill="#10b981" font-size="11" font-weight="600">Wet-lab match</text>
    </g>

  </g>
</svg>
