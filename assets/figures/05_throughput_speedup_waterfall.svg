<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background:#080e1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#14233e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#080e1a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="netGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barBaseline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="barReduction" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="barOverhead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="barNet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e33"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowNet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="650" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="650"/>
    <line x1="500" y1="0" x2="500" y2="650"/>
    <line x1="800" y1="0" x2="800" y2="650"/>
    <line x1="1050" y1="0" x2="1050" y2="650"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 36)">
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#1e293b" stroke="rgba(52,211,153,0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#34d399"/>
    <text x="24" y="16" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1.2">COMPUTATIONAL EFFICIENCY</text>

    <text x="0" y="56" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">52% Wall-Clock Throughput Acceleration</text>
    <text x="0" y="80" fill="#94a3b8" font-size="14" font-weight="400">Stepwise breakdown of how algorithmic innovations cut simulation time from 55.0 to 26.2 hours per perturbation edge.</text>
  </g>

  <!-- WATERFALL CHART CONTAINER (X: 60 - 1140, Y: 125 - 460) -->
  <g transform="translate(60, 115)">
    <rect width="1080" height="340" rx="16" fill="url(#cardDark)" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#cardShadow)"/>

    <!-- Left Y-Axis & Horizontal Grid Lines -->
    <!-- y = 300 is 0 hrs, y = 30 is 60 hrs (Scale: 1 hr = 4.5 px) -->
    <g transform="translate(50, 0)">
      <!-- Grid lines -->
      <line x1="30" y1="300" x2="1000" y2="300" stroke="#334155" stroke-width="1.5"/>
      <line x1="30" y1="210" x2="1000" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="30" y1="120" x2="1000" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="30" y1="30" x2="1000" y2="30" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Y-Axis Labels -->
      <text x="20" y="304" fill="#64748b" font-size="11" font-weight="600" text-anchor="end">0 h</text>
      <text x="20" y="214" fill="#64748b" font-size="11" font-weight="600" text-anchor="end">20 h</text>
      <text x="20" y="124" fill="#64748b" font-size="11" font-weight="600" text-anchor="end">40 h</text>
      <text x="20" y="34" fill="#64748b" font-size="11" font-weight="600" text-anchor="end">60 h</text>
      <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="700">Hours / Edge</text>
    </g>

    <!-- WATERFALL BARS & STEP CONNECTORS -->
    <!-- Origin: baseline y = 300 px -->

    <!-- BAR 1: Classical Baseline (55.0 hrs) -->
    <!-- Height = 55.0 * 4.5 = 247.5 px -> Top y = 300 - 247.5 = 52.5 px -->
    <g transform="translate(130, 0)">
      <rect x="0" y="52.5" width="105" height="247.5" rx="6" fill="url(#barBaseline)" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="52.5" y="42" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">55.0 hrs</text>
      
      <!-- Label below bar -->
      <text x="52.5" y="318" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Baseline</text>
      <text x="52.5" y="331" fill="#94a3b8" font-size="9.5" text-anchor="middle">11 windows × 5ns</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="235" y1="52.5" x2="280" y2="52.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- BAR 2: H-REX Mixing (-12.5 hrs) -->
    <!-- Starts at 52.5, drops by 12.5 * 4.5 = 56.25 px -> ends at y = 108.75 px -->
    <g transform="translate(280, 0)">
      <rect x="0" y="52.5" width="105" height="56.25" rx="6" fill="url(#barReduction)" stroke="#34d399" stroke-width="1.5"/>
      <!-- Down arrow & value -->
      <text x="52.5" y="86" fill="#ffffff" font-size="13.5" font-weight="800" text-anchor="middle">▼ -12.5 h</text>
      
      <text x="52.5" y="318" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">H-REX Mixing</text>
      <text x="52.5" y="331" fill="#94a3b8" font-size="9.5" text-anchor="middle">Phase overlap</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="385" y1="108.75" x2="430" y2="108.75" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- BAR 3: Adaptive Lambda Allocation (-11.0 hrs) -->
    <!-- Starts at 108.75, drops by 11.0 * 4.5 = 49.5 px -> ends at y = 158.25 px -->
    <g transform="translate(430, 0)">
      <rect x="0" y="108.75" width="105" height="49.5" rx="6" fill="url(#barReduction)" stroke="#34d399" stroke-width="1.5"/>
      <text x="52.5" y="139" fill="#ffffff" font-size="13.5" font-weight="800" text-anchor="middle">▼ -11.0 h</text>
      
      <text x="52.5" y="318" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Adaptive λ</text>
      <text x="52.5" y="331" fill="#94a3b8" font-size="9.5" text-anchor="middle">7 smart windows</text>
    </g>

    <!-- Connector 3 -> 4 -->
    <line x1="535" y1="158.25" x2="580" y2="158.25" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- BAR 4: Early Stopping (-8.5 hrs) -->
    <!-- Starts at 158.25, drops by 8.5 * 4.5 = 38.25 px -> ends at y = 196.5 px -->
    <g transform="translate(580, 0)">
      <rect x="0" y="158.25" width="105" height="38.25" rx="6" fill="url(#barReduction)" stroke="#34d399" stroke-width="1.5"/>
      <text x="52.5" y="182" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">▼ -8.5 h</text>
      
      <text x="52.5" y="318" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">Early Stop</text>
      <text x="52.5" y="331" fill="#94a3b8" font-size="9.5" text-anchor="middle">Cycle closure</text>
    </g>

    <!-- Connector 4 -> 5 -->
    <line x1="685" y1="196.5" x2="730" y2="196.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- BAR 5: MACE AI Overhead (+3.2 hrs) -->
    <!-- Starts at 196.5, rises by 3.2 * 4.5 = 14.4 px -> ends at y = 182.1 px -->
    <g transform="translate(730, 0)">
      <rect x="0" y="182.1" width="105" height="14.4" rx="4" fill="url(#barOverhead)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="52.5" y="174" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle">▲ +3.2 h</text>
      
      <text x="52.5" y="318" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">MACE Neural</text>
      <text x="52.5" y="331" fill="#94a3b8" font-size="9.5" text-anchor="middle">Quantum precision</text>
    </g>

    <!-- Connector 5 -> 6 -->
    <line x1="835" y1="182.1" x2="890" y2="182.1" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- BAR 6: Accelerated Hybrid Pipeline (26.2 hrs) -->
    <!-- From y = 182.1 down to 300 px. Height = 117.9 px -->
    <g transform="translate(890, 0)">
      <!-- Glow surrounding final bar -->
      <rect x="-6" y="176" width="137" height="130" rx="10" fill="#10b981" opacity="0.2" filter="url(#glowNet)"/>
      <rect x="0" y="182.1" width="125" height="117.9" rx="8" fill="url(#barNet)" stroke="#34d399" stroke-width="2"/>
      
      <!-- Top Callout Box -->
      <g transform="translate(62.5, 148)">
        <rect x="-58" y="-22" width="116" height="26" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
        <text x="0" y="-5" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">26.2 hrs</text>
      </g>
      
      <text x="62.5" y="318" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">OUR PIPELINE</text>
      <text x="62.5" y="331" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">52.4% Faster</text>
    </g>

    <!-- NET SPEEDUP DELTA BRACKET -->
    <!-- Spans between Bar 1 (x=182.5, y=52.5) and Bar 6 (x=890, y=182.1) -->
    <g transform="translate(0, 0)">
      <line x1="235" y1="52.5" x2="952" y2="52.5" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
      
      <!-- Delta Annotation Badge -->
      <g transform="translate(560, 40)">
        <rect x="-80" y="-14" width="160" height="26" rx="13" fill="#111f36" stroke="#34d399" stroke-width="1.5"/>
        <circle cx="-62" cy="-1" r="5" fill="#34d399"/>
        <text x="0" y="3" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">-28.8 hrs (-52.4%)</text>
      </g>
    </g>

  </g>

  <!-- BOTTOM LEVER EXPLANATION ROW (Y: 475 - 580) -->
  <g transform="translate(60, 470)">
    
    <!-- Lever 1 Box -->
    <g transform="translate(0, 0)">
      <rect width="255" height="78" rx="10" fill="#0f1a2d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#34d399"/>
      <text x="26" y="22" fill="#ffffff" font-size="11" font-weight="700">1. Replica Exchange (H-REX)</text>
      <text x="14" y="42" fill="#94a3b8" font-size="10.5">Continuous thermal swaps prevent</text>
      <text x="14" y="58" fill="#94a3b8" font-size="10.5">conformation kinetic stagnation.</text>
      <text x="200" y="22" fill="#34d399" font-size="11" font-weight="800">-12.5h</text>
    </g>

    <!-- Lever 2 Box -->
    <g transform="translate(275, 0)">
      <rect width="255" height="78" rx="10" fill="#0f1a2d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#34d399"/>
      <text x="26" y="22" fill="#ffffff" font-size="11" font-weight="700">2. Adaptive λ Allocation</text>
      <text x="14" y="42" fill="#94a3b8" font-size="10.5">Dynamically condenses 11 uniform</text>
      <text x="14" y="58" fill="#94a3b8" font-size="10.5">windows into 7 high-variance zones.</text>
      <text x="200" y="22" fill="#34d399" font-size="11" font-weight="800">-11.0h</text>
    </g>

    <!-- Lever 3 Box -->
    <g transform="translate(550, 0)">
      <rect width="255" height="78" rx="10" fill="#0f1a2d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#34d399"/>
      <text x="26" y="22" fill="#ffffff" font-size="11" font-weight="700">3. Cycle-Closure Early Stop</text>
      <text x="14" y="42" fill="#94a3b8" font-size="10.5">Stops runs when thermodynamic</text>
      <text x="14" y="58" fill="#94a3b8" font-size="10.5">hysteresis converges &lt; 0.15 kcal/mol.</text>
      <text x="205" y="22" fill="#34d399" font-size="11" font-weight="800">-8.5h</text>
    </g>

    <!-- Lever 4 Box -->
    <g transform="translate(825, 0)">
      <rect width="255" height="78" rx="10" fill="#1a1c22" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#fbbf24"/>
      <text x="26" y="22" fill="#ffffff" font-size="11" font-weight="700">4. MACE Neural Core</text>
      <text x="14" y="42" fill="#fef3c7" font-size="10.5">+3.2h inference investment yields</text>
      <text x="14" y="58" fill="#fbbf24" font-size="10.5">quantum polarization fidelity.</text>
      <text x="200" y="22" fill="#fbbf24" font-size="11" font-weight="800">+3.2h</text>
    </g>

  </g>

  <!-- BOTTOM EXECUTIVE SUMMARY STRIP -->
  <g transform="translate(60, 565)">
    <rect width="1080" height="48" rx="10" fill="#08281e" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#34d399"/>
    
    <text x="40" y="28" fill="#ffffff" font-size="13" font-weight="800">
      BOTTOM LINE: <tspan fill="#34d399">2.1x Campaign Velocity Multiplier</tspan>
      <tspan fill="#cbd5e1" font-weight="500"> — We cut compute spend by 52.4% while simultaneously replacing force-field errors with DFT accuracy.</tspan>
    </text>
  </g>
</svg>
