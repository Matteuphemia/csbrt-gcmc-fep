output_dir: csbrt-run
# --- preprocess ---
receptor:      ../protein_prep/inputs/recfinal_7dli_water.pdb
template_cif:  ../protein_prep/inputs/7dli.cif
receptor_chain: B
template_chain: B
ligand_sdf:    ../protein_prep/inputs/cry1_ligands.sdf
ligand_name:   7dli
loop:
  after_resid: 395
  sequence:    FFQQFF
use_msa_server: false      # true -> fetch MSAs from the ColabFold server
ph: 7.4
runner_yaml: runner_turing.yml   # Turing (2080 Ti) only; unset on Ampere+
diffusion_samples: 1
model_seeds: 1
# --- endpoint (equilibrate / gcmc) ---
seed: 20260714
profile: full             # 'smoke' for plumbing tests
# --- fep ---
edges: fep_edges/edges.tsv
# --- mlff surrogate (MACE + Active Learning) ---
mlff:
  enabled: false             # set true to enable MACE surrogate acceleration
  model_name: mace-off23-small # mace-off23-small, mace-off23-medium, mace-omol-0
  uq_force_threshold: 0.05   # eV/A; triggers physics fallback if exceeded
  device: cuda               # cuda or cpu
# --- analysis ---
rowan_edges:  # optional benchmark CSV
experimental: # optional per-compound experimental dG CSV
