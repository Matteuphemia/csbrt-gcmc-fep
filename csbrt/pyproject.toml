[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csbrt"
version = "0.1.0"
description = "Hydration-aware GCMC + FEP workflow: OpenFold3 loop modelling, Loch GCMC, SOMD2 relative FEP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# NOTE: the scientific stack (sire, somd2, loch, biosimspace, openmm, ambertools,
# openfold3, torch) is intentionally NOT declared here. Those are conda/pip
# packages installed via environment.yml; declaring them as pip requirements
# would make `pip install` attempt to resolve packages that do not exist on PyPI.
dependencies = ["pyyaml", "numpy"]

[project.scripts]
csbrt             = "csbrt.cli:main"
csbrt-preprocess  = "csbrt.cli:preprocess"
csbrt-equilibrate = "csbrt.cli:equilibrate"
csbrt-gcmc        = "csbrt.cli:gcmc"
csbrt-fep         = "csbrt.cli:fep"
csbrt-analysis    = "csbrt.cli:analysis"
csbrt-mace-preflight = "csbrt.mace_preflight:main"
csbrt-mace-benchmark = "csbrt.mace_benchmark:main"
csbrt-mace-al        = "csbrt.mace_active_learning:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csbrt = ["*.py", "*.yaml", "*.yml", "*.slurm", "*.sh"]

[project.optional-dependencies]
# The MACE surrogate. openmm-ml is conda-forge only, so it is not listed here;
# environment.yml installs it. mace-torch and its torch pin come from pip in
# install.sh, against the cu126 wheels the rest of the stack uses.
test = ["pytest"]
